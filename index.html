    <!-- ── Tipografías, servidas desde aquí ───────────────────────────────
         Antes se pedían al CDN de Google: DNS + TLS + un CSS + los archivos
         que ese CSS nombra, dos viajes encadenados a un tercero antes de
         poder pintar bien una palabra. Una app instalada no puede depender de
         internet para dibujar su propia letra, y esta se abre en fiestas con
         el wifi del bar.

         `font-display: block` en vez de `swap`: desde el mismo origen la
         espera es de milisegundos, así que compensa esperar y pintar ya con
         la letra buena en vez de pintar con otra y cambiarla a la vista —
         ese salto del texto es de las cosas que más delatan una web.

         De paso, el navegador de quien juega deja de conectarse a Google: un
         tercero menos que declarar en la política de privacidad.

         Las genera scripts/fuentes.mjs.
    ────────────────────────────────────────────────────────────────────── -->
    <link rel="preload" href="/fonts/montserrat-normal-latin-a5ec5492.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/hanken-grotesk-normal-latin-38c3847f.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fuentes.css">
    <!-- Lista de iconos en uso. La mantiene scripts/iconos.mjs y la lee
         scripts/fuentes.mjs para bajar el subconjunto. NO es un enlace: la
         fuente se sirve desde /fonts, sin conexión a terceros. -->
    <meta name="dedicalo-iconos" content="add,add_box,album,arrow_back,arrow_forward,auto_awesome,autorenew,block,bolt,bomb,cancel,celebration,check,check_circle,close,content_copy,download,edit,electric_bolt,emoji_events,equalizer,error,expand_more,format_size,graphic_eq,groups,headphones,help,host,info,ios_share,keyboard,library_music,local_fire_department,login,logout,meeting_room,mood,move_down,music_note,pause,payments,person,pets,play_arrow,playlist_add,progress_activity,public,qr_code_scanner,radio_button_unchecked,refresh,remove,replay,restaurant,screen_rotation,share,smartphone,sports_esports,sports_soccer,stadium,star,stay_current_landscape,stay_current_portrait,timeline,touch_app,tv,volume_up,warning,wb_sunny,wifi_off,zoom_in" />

  <body class="bg-surface text-on-surface min-h-screen">
    <!-- ── Arranque ──────────────────────────────────────────────────────
         Esto se pinta ANTES de que exista React, antes de descargar el
         JavaScript y antes de que carguen las tipografías: es HTML y CSS en
         línea, así que el navegador lo dibuja en el primer fotograma.

         Cubre el hueco que hasta ahora se veía en blanco (o, ya dentro, con
         el cartel de "CARGANDO"). Una app instalada nunca enseña ese hueco.

         Se quita solo desde main.jsx cuando React ya ha pintado, con un
         fundido de 380 ms para que el cambio no sea un corte.
    ─────────────────────────────────────────────────────────────────── -->
    <style>
      #arranque {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #071025;
        transition: opacity 380ms ease, visibility 380ms;
      }
      #arranque.fuera { opacity: 0; visibility: hidden; pointer-events: none; }
      #arranque img { width: 124px; height: 124px; object-fit: contain; }
      #arranque .barra {
        width: 128px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
      }
      /* Una barra que se mueve sola. No mide nada real —no hay nada que medir
         todavía— pero dice "sigo vivo", que es lo único que hace falta
         durante menos de un segundo. Es un solo transform: gratis. */
      #arranque .barra i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #ff7a1a, #a855f7);
        animation: arranque-vaiven 1.1s ease-in-out infinite;
      }
      @keyframes arranque-vaiven {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #arranque .barra i { animation: none; width: 100%; }
      }
    </style>
    <div id="arranque">
      <img src="/images/app/icon-512.png" alt="" width="124" height="124" />
      <div class="barra"><i></i></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
