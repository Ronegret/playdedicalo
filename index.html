    <!-- ── Tipografías, servidas desde aquí ───────────────────────────────
         Antes se pedían al CDN de Google: DNS + TLS + un CSS + los archivos
         que ese CSS nombra, dos viajes encadenados a un tercero antes de
         poder pintar bien una palabra. Una app instalada no puede depender de
         internet para dibujar su propia letra, y esta se abre en fiestas con
         el wifi del bar.

         `font-display: block` en vez de `swap`: desde el mismo origen la
         espera es de milisegundos, así que compensa esperar y pintar ya con
         la letra buena en vez de pintar con otra y cambiarla a la vista —
         ese salto del texto es de las cosas que más delatan una web.

         De paso, el navegador de quien juega deja de conectarse a Google: un
         tercero menos que declarar en la política de privacidad.

         Las genera scripts/fuentes.mjs.
    ────────────────────────────────────────────────────────────────────── -->
    <link rel="preload" href="/fonts/montserrat-normal-latin-a5ec5492.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/hanken-grotesk-normal-latin-38c3847f.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fuentes.css">
    <!-- Firebase Auth abre sesión (anónima o con Google) en cuanto arranca la
         app, y hasta que responde solo se ve la pantalla de arranque. Abrir ya
         la conexión (DNS + TLS) con sus servidores ahorra ese saludo en el
         camino crítico: en 4G son 300-500 ms. `crossorigin` solo donde la
         petición es un fetch con CORS; si no, el navegador no la reutiliza. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://dedicalo-play-trivia-7.firebaseapp.com">
    <link rel="preconnect" href="https://apis.google.com">
    <link rel="dns-prefetch" href="https://www.googleapis.com">
    <!-- Lista de iconos en uso. La mantiene scripts/iconos.mjs y la lee
         scripts/fuentes.mjs para bajar el subconjunto. NO es un enlace: la
         fuente se sirve desde /fonts, sin conexión a terceros. -->
    <meta name="dedicalo-iconos" content="add,add_box,album,arrow_back,arrow_forward,auto_awesome,autorenew,block,bolt,bomb,cancel,celebration,check,check_circle,close,content_copy,download,edit,electric_bolt,emoji_events,equalizer,error,expand_more,format_size,graphic_eq,groups,headphones,help,host,info,ios_share,keyboard,library_music,local_fire_department,login,logout,meeting_room,mood,move_down,music_note,pause,payments,person,pets,play_arrow,playlist_add,progress_activity,public,qr_code_scanner,radio_button_unchecked,refresh,remove,replay,restaurant,screen_rotation,share,smartphone,sports_esports,stadium,star,stay_current_landscape,stay_current_portrait,tv,volume_up,warning,wb_sunny,wifi_off,zoom_in" />
    <link rel="preload" href="/images/logo-main.webp" as="image" type="image/webp" fetchpriority="high">
    <!-- Intro: decide ANTES de pintar si toca la versión larga (primera vez
         en esta sesión) o la corta, y cuándo puede irse. Se va cuando se
         cumplen las tres cosas, lo que ocurra después:
           1. React ya ha pintado (main.jsx llama a __arranqueListo),
           2. no queda ninguna pantalla de carga debajo (PageLoader se
              "retiene" mientras está montado: así no se ve la intro, luego
              otra espera distinta y luego la app),
           3. ha terminado su número (2,3 s la primera vez, nada después).
         Un toque se salta el punto 3. Pase lo que pase, a los 8 s se va.
         Si sessionStorage falla (modo privado) se ve la larga: no rompe nada. -->
    <script>
      (function () {
        var raiz = document.documentElement, visto = false, listo = false, hecho = false, retenida = 0;
        try { visto = sessionStorage.getItem('dedicalo_intro') === '1'; sessionStorage.setItem('dedicalo_intro', '1'); } catch (e) {}
        var quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (visto) raiz.classList.add('intro-corta');
        var fin = performance.now() + (visto ? 0 : quieto ? 700 : 2300);
        function salir() {
          var a = document.getElementById('arranque');
          if (hecho || !a) return;
          hecho = true;
          a.classList.add('fuera');
          setTimeout(function () { a.remove(); }, 460);
        }
        function intentar() {
          if (hecho || !listo || retenida > 0) return;
          var falta = fin - performance.now();
          if (falta > 0) setTimeout(intentar, falta); else salir();
        }
        window.__arranqueListo = function () { listo = true; intentar(); };
        window.__retenerArranque = function () {
          if (hecho) return function () {};
          retenida++;
          return function () { retenida--; intentar(); };
        };
        window.__saltarIntro = function () { fin = 0; intentar(); };
        setTimeout(salir, 8000);
      })();
    </script>
  </head>
  <!-- bg-background, NO bg-surface: son dos grises distintos (#050816 vs
       #07101f) y la diferencia se veía como una franja de otro tono en los
       bordes y al rebotar el scroll. -->
  <body class="bg-background text-on-surface min-h-screen">
    <!-- ── Arranque ──────────────────────────────────────────────────────
         Esto se pinta ANTES de que exista React, antes de descargar el
         JavaScript y antes de que carguen las tipografías: es HTML y CSS en
         línea, así que el navegador lo dibuja en el primer fotograma.

         Cubre el hueco que hasta ahora se veía en blanco (o, ya dentro, con
         el cartel de "CARGANDO"). Una app instalada nunca enseña ese hueco.

         Se quita solo desde main.jsx cuando React ya ha pintado, con un
         fundido de 380 ms para que el cambio no sea un corte.
    ─────────────────────────────────────────────────────────────────── -->
    <style>
      /* ── Intro de arranque ───────────────────────────────────────────
         Un vinilo que entra girando, dos ondas de neón y el logo que cae
         encima como una pegatina. Solo transform y opacity: la animación
         corre en el compositor y no frena la descarga del JavaScript.
         Dura lo mismo que la carga, nunca más de 2,3 s, y solo la primera
         vez de cada sesión. Un toque la salta. */
      #arranque {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(60% 45% at 50% 46%, rgba(168, 85, 247, 0.22), transparent 70%),
          radial-gradient(40% 30% at 50% 56%, rgba(255, 122, 26, 0.14), transparent 70%),
          #050816;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        transition: opacity 420ms ease, visibility 420ms;
      }
      #arranque .escena {
        position: relative;
        width: min(78vw, 46vh, 340px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        transition: transform 420ms cubic-bezier(0.4, 0, 1, 1);
      }
      #arranque .escena > * { grid-area: 1 / 1; }
      /* Vinilo: los mismos surcos que el de la sala. */
      #arranque .disco {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle, #050816 0 2.2%, #ff7a1a 2.6% 15%, #ef4444 15.4% 16.2%, #0b0b0b 16.8%, transparent 17%),
          repeating-radial-gradient(circle, #0b0b0b 0px, #0b0b0b 2px, #191919 3px, #191919 5px, #0b0b0b 6px, #0b0b0b 9px);
        box-shadow: 0 0 0 2px #23233a, 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 70px rgba(168, 85, 247, 0.35);
        animation:
          arr-disco-entra 700ms cubic-bezier(0.16, 1, 0.3, 1) both,
          arr-gira 1.6s linear infinite;
      }
      /* Brillo fijo encima del disco que gira: así parece luz de verdad. */
      #arranque .brillo {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: conic-gradient(from 20deg, transparent 0 8%, rgba(255, 255, 255, 0.10) 12%, transparent 18% 50%, rgba(255, 255, 255, 0.07) 62%, transparent 68%);
        animation: arr-aparece 700ms ease-out both;
      }
      #arranque .onda {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid #ff7a1a;
        opacity: 0;
        animation: arr-onda 1.3s cubic-bezier(0.22, 1, 0.36, 1) 500ms infinite;
      }
      #arranque .onda.dos { border-color: #a855f7; animation-delay: 950ms; }
      #arranque .logo {
        width: 92%;
        height: auto;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55));
        animation: arr-logo 620ms cubic-bezier(0.34, 1.56, 0.64, 1) 380ms both;
      }
      #arranque .eq {
        position: absolute;
        left: 50%;
        top: calc(100% + 18px);
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 26px;
        transform: translateX(-50%);
        animation: arr-aparece 400ms ease-out 800ms both;
      }
      #arranque .eq i {
        width: 6px;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(#39ff14, #a855f7);
        transform-origin: bottom;
        animation: arr-eq 700ms ease-in-out infinite alternate;
      }
      #arranque .eq i:nth-child(2) { animation-delay: -200ms; }
      #arranque .eq i:nth-child(3) { animation-delay: -450ms; }
      #arranque .eq i:nth-child(4) { animation-delay: -100ms; }
      #arranque .eq i:nth-child(5) { animation-delay: -550ms; }
      #arranque .eq i:nth-child(6) { animation-delay: -300ms; }
      #arranque .eq i:nth-child(7) { animation-delay: -650ms; }
      @keyframes arr-disco-entra {
        from { opacity: 0; scale: 0.55; }
        to { opacity: 1; scale: 1; }
      }
      @keyframes arr-gira { to { rotate: 360deg; } }
      @keyframes arr-aparece { from { opacity: 0; } }
      @keyframes arr-onda {
        0% { opacity: 0.8; transform: scale(0.96); }
        100% { opacity: 0; transform: scale(1.45); }
      }
      @keyframes arr-logo {
        from { opacity: 0; transform: scale(1.5) rotate(-10deg); }
        to { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes arr-eq {
        from { transform: scaleY(0.2); }
        to { transform: scaleY(1); }
      }
      /* Salida: la escena se acerca un poco mientras se funde. */
      #arranque.fuera { opacity: 0; visibility: hidden; pointer-events: none; }
      #arranque.fuera .escena { transform: scale(1.12); }
      /* Segunda visita de la sesión: sin coreografía de entrada. */
      .intro-corta #arranque .disco { animation: arr-gira 1.6s linear infinite; }
      .intro-corta #arranque .brillo,
      .intro-corta #arranque .logo,
      .intro-corta #arranque .eq { animation: none; }
      @media (prefers-reduced-motion: reduce) {
        #arranque *, #arranque .eq i { animation: none !important; }
        #arranque .onda { display: none; }
        #arranque .eq i { transform: scaleY(0.6); }
        #arranque.fuera .escena { transform: none; }
      }
    </style>
    <div id="arranque" onclick="window.__saltarIntro && window.__saltarIntro()">
      <div class="escena">
        <span class="onda"></span>
        <span class="onda dos"></span>
        <span class="disco"></span>
        <span class="brillo"></span>
        <!-- logo-main.webp: 32 kB, precargado en <head>. -->
        <img class="logo" src="/images/logo-main.webp" alt="Dedícalo" width="500" height="500" fetchpriority="high" />
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
